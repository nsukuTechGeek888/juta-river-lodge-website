<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Juta River · Event Admin</title>
<link rel="stylesheet" href="admin.css">
<style>
  .badge-featured{background:#f1c45e;color:#080909;font-size:7px;padding:3px 8px;border-radius:30px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;display:inline-block;margin-left:8px}
  .hero-option{display:flex;align-items:center;gap:12px;background:#0f1416;padding:8px 14px;border-radius:30px;margin-top:8px;cursor:pointer}
  .hero-option input{width:18px;height:18px;accent-color:#f1c45e;margin:0}
  .hero-option label{margin:0;text-transform:none;color:#eee;font-size:11px;cursor:pointer}
  .file-hint{font-size:9px;color:#666;margin-top:4px;display:block}
</style>
</head>
<body>
<header><b>THE JUTA <span>RIVER</span></b><a href="../index.html" target="_blank">View website ↗</a></header>
<main>
  <section class="intro"><div><small>EVENT CONTROL</small><h1>Manage <i>what's on.</i></h1><p>Add events, upload posters and background videos. Choose which event features in the hero countdown.</p></div><button id="add">+ Add event</button></section>
  <section class="stats"><div><b id="total">0</b><span>Total events</span></div><div><b id="upcoming">0</b><span>Upcoming</span></div><div><b id="next">—</b><span>Next event</span></div></section>
  <div class="tools"><input id="search" placeholder="Search events"><select id="filter"><option value="all">All</option><option value="upcoming">Upcoming</option><option value="past">Past</option></select></div>
  <div id="list"></div>
</main>

<div id="modal" class="modal">
  <form id="form">
    <button type="button" id="close">×</button>
    <small>EVENT DETAILS</small>
    <h2 id="title">Add event</h2>
    <input type="hidden" id="id">
    
    <label>Event name
      <input id="name" required placeholder="Metro Home Coming">
    </label>
    
    <div class="two">
      <label>Date
        <input id="date" type="date" required>
      </label>
      <label>Time
        <input id="time" type="time" value="20:00" required>
      </label>
    </div>
    
    <label>Location
      <input id="location" value="The Juta River · Giyani">
    </label>
    
    <label>Description
      <input id="desc" placeholder="Music · Food · Good people">
    </label>
    
    <label>Ticket / event link
      <input id="link" type="url" placeholder="https://...">
    </label>
    
    <label>Poster Image
      <input id="poster" type="file" accept="image/*">
      <span class="file-hint">Upload a poster image (JPG, PNG, etc.) - max 200KB</span>
    </label>
    
    <label>Hero Background Video (optional)
      <input id="video" type="file" accept="video/*,.gif">
      <span class="file-hint">Upload a video or GIF for the hero background - max 50MB</span>
    </label>
    
    <div id="preview">No media selected</div>
    
    <div class="hero-option">
      <input id="hero" type="checkbox">
      <label for="hero">⭐ Feature this event in the hero section</label>
    </div>
    
    <button type="submit">Save event</button>
  </form>
</div>

<script src="../config.js"></script>
<script src="admin.js"></script>
</body>
</html>
