<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Juta River Event Admin</title><link rel="stylesheet" href="admin.css"></head><body>
<header><b>THE JUTA <span>RIVER</span></b><a href="../index.html" target="_blank">View website ↗</a></header>
<main><section class="intro"><div><small>EVENT CONTROL</small><h1>Manage <i>what's on.</i></h1><p>Add events, upload posters and set the exact date/time for the countdown.</p></div><button id="add">+ Add event</button></section>
<section class="stats"><div><b id="total">0</b><span>Total events</span></div><div><b id="upcoming">0</b><span>Upcoming</span></div><div><b id="next">—</b><span>Next event</span></div></section>
<div class="tools"><input id="search" placeholder="Search events"><select id="filter"><option value="all">All</option><option value="upcoming">Upcoming</option><option value="past">Past</option></select></div><div id="list"></div></main>
<div id="modal" class="modal"><form id="form"><button type="button" id="close">×</button><small>EVENT DETAILS</small><h2 id="title">Add event</h2><input type="hidden" id="id"><label>Event name<input id="name" required placeholder="Metro Home Coming"></label><div class="two"><label>Date<input id="date" type="date" required></label><label>Time<input id="time" type="time" value="20:00" required></label></div><label>Location<input id="location" value="The Juta River · Giyani"></label><label>Description<input id="desc" placeholder="Music · Food · Good people"></label><label>Ticket / event link<input id="link" type="url" placeholder="https://..."></label><label>Poster<input id="poster" type="file" accept="image/*"></label><div id="preview">No poster selected</div><button>Save event</button></form></div>
<script src="admin.js"></script></body></html>
